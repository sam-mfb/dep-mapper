name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml is the source of truth for the toolchain:
      # rustup reads it and installs the pinned channel and components.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Lint with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      # The TypeScript grapher's tests drive its collector through
      # Node, so install Node and the collector's pinned dependencies
      # first. The pinned toolchain already carries rustc-dev and
      # llvm-tools for the Rust grapher's driver (rust-toolchain.toml).
      - name: Install Node for the TypeScript grapher
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/project-graph-typescript/collector/package-lock.json

      - name: Install the TypeScript collector dependencies
        working-directory: crates/project-graph-typescript/collector
        run: npm ci

      # The Rust tests only exercise the collector paths the sample
      # hits, so type-check the collector itself as well.
      - name: Type-check the TypeScript collector
        working-directory: crates/project-graph-typescript/collector
        run: npx tsc -p .

      - name: Run all workspace tests
        run: cargo test --workspace --locked

  driver:
    name: Rust grapher driver
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The driver links the compiler, so it is its own workspace
      # outside the main one and is checked separately. It builds
      # with the pinned toolchain, whose rustc-dev component
      # rust-toolchain.toml already lists.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/project-graph-rust/driver

      - name: Check formatting
        working-directory: crates/project-graph-rust/driver
        run: cargo fmt --check

      - name: Lint with warnings denied
        working-directory: crates/project-graph-rust/driver
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo clippy --all-targets --locked -- -D warnings
