resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/sharsheret"

[workspace.dependencies]
graph-evaluator = { path = "crates/graph-evaluator" }
map-builder = { path = "crates/map-builder" }
