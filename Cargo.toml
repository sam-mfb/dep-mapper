[workspace]
members = ["crates/project-graph", "crates/graph-evaluator", "crates/project-map", "crates/map-web", "crates/project-graph-rust", "crates/project-graph-rust/records"]
exclude = ["crates/project-graph-rust/driver", "crates/project-graph-rust/tests/fixture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/sharsheret"

[workspace.dependencies]
project-graph = { path = "crates/project-graph" }
project-map = { path = "crates/project-map" }
thiserror = "2.0.21"
