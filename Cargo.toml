[workspace]
members = ["crates/project-graph", "crates/graph-evaluator", "crates/project-map", "crates/map-web", "crates/map-persist", "crates/map-builder", "crates/mapper", "crates/graph-evaluator-llm", "crates/graph-evaluator-manual", "crates/map-preview", "crates/map-draft", "crates/graph-evaluator-pieces", "crates/project-graph-typescript"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/sharsheret"

[workspace.dependencies]
graph-evaluator = { path = "crates/graph-evaluator" }
map-builder = { path = "crates/map-builder" }
map-draft = { path = "crates/map-draft" }
map-preview = { path = "crates/map-preview" }
map-persist = { path = "crates/map-persist" }
map-web = { path = "crates/map-web" }
graph-evaluator-pieces = { path = "crates/graph-evaluator-pieces" }
project-graph = { path = "crates/project-graph" }
project-map = { path = "crates/project-map" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
