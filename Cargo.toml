[workspace]
members = ["crates/project-graph", "crates/graph-evaluator", "crates/graph-evaluator-manual", "crates/project-map", "crates/map-web", "crates/map-persist", "crates/project-graph-typescript"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sam-mfb/sharsheret"

[workspace.dependencies]
graph-evaluator = { path = "crates/graph-evaluator" }
project-graph = { path = "crates/project-graph" }
project-map = { path = "crates/project-map" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
