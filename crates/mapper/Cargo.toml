[package]
name = "mapper"
description = "The srs program: composes graphing, evaluation, map building, storage and display"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "srs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
graph-evaluator.workspace = true
graph-evaluator-manual = { path = "../graph-evaluator-manual" }
map-builder.workspace = true
map-persist.workspace = true
map-web.workspace = true
project-graph.workspace = true
project-graph-typescript = { path = "../project-graph-typescript" }
project-map.workspace = true
thiserror.workspace = true

[dev-dependencies]
graph-evaluator = { workspace = true, features = ["testing"] }
project-graph = { workspace = true, features = ["testing"] }
