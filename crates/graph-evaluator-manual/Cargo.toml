[package]
name = "graph-evaluator-manual"
description = "Lets an agent harness or a person evaluate a project graph through a workbook of pieces and checked answers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
graph-evaluator.workspace = true
graph-evaluator-pieces.workspace = true
project-graph.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror.workspace = true

[dev-dependencies]
graph-evaluator-pieces = { workspace = true, features = ["testing"] }
