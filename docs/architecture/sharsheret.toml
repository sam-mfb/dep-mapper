# sharsheret's own architecture map, as a draft made only of proposals.
# It is the project's module map: edit it when the architecture changes.
# Check it with `srs draft check docs/architecture/sharsheret.toml`, and
# preview it with `srs draft preview docs/architecture/sharsheret.toml`.
# crates/map-persist/FORMAT.md describes the format.

format = 1
kind = "draft"
project = "sharsheret"
layers = ["Program", "Map", "Evaluation", "Evidence"]

[modules.graph-evaluator]
status = "proposed-addition"
name = "graph-evaluator"

[[modules.graph-evaluator.surface]]
name = "GraphEvaluator"
kind = "type"
signature = "pub trait GraphEvaluator"

[[modules.graph-evaluator.surface]]
name = "GraphEvaluation"
kind = "type"
signature = "pub struct GraphEvaluation"

[modules.graph-evaluator.review]
state = "judged"
reason = "Defines the GraphEvaluation type and the evaluator contract. The selected implementation obtains judgments from a human or a model."
concern = "Defines how to evaluate a project graph and record architectural judgments about its modules and routes."
kind = "contract"
layer = "Evaluation"
primary = "module:graph-evaluator"
supporting = []

