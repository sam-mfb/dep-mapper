reason = "Owns the workbook, the answer commands and the checks on each answer and citation. The worker is reached through an injected agent runner, and the workbook through an injected store."
concern = "Has an agent harness or a person evaluate a graph through a workbook of pieces and checked answers."
kind = "effect"
layer = "Evaluation"
primary = "module:graph-evaluator-manual"
supporting = []

