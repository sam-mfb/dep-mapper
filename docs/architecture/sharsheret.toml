kind = "type"

[modules.graph-evaluator-llm.review]
state = "judged"
reason = "Owns model interaction and interpretation of the API response. Provider-specific requests and responses stay inside this module, behind its own model-client contract; Mapper injects the HTTP transport."
concern = "Obtains an architectural judgment from a language model."
kind = "effect"
layer = "Evaluation"
primary = "module:graph-evaluator-llm"
supporting = []

